<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="rockBase" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="35%" stop-color="#64748b" />
      <stop offset="70%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="rockGlow">
      <feDropShadow dx="4" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>
  <g filter="url(#rockGlow)">
    <!-- Основная грань камня -->
    <path d="M 35,15 L 85,20 L 105,55 L 90,95 L 50,105 L 15,85 L 10,45 Z" fill="url(#rockBase)" stroke="#e2e8f0" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Ребра и грани для объема -->
    <path d="M 35,15 L 55,55 L 105,55" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 55,55 L 50,105" fill="none" stroke="rgba(15,23,42,0.7)" stroke-width="3" stroke-linecap="round" />
    <path d="M 55,55 L 15,85" fill="none" stroke="rgba(15,23,42,0.6)" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 35,15 L 10,45" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2" />
  </g>
</svg>
