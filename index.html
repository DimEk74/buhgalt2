<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Аутсорсинг Бухгалтерии | Краш-Тест 2026</title>

  <!--
    🔒 Content Security Policy — разрешаем скрипты и шрифты с известных CDN.
  -->
  <meta http-equiv="Content-Security-Policy"
        content="
          default-src 'self';
          script-src  'self' 'unsafe-inline'
                      https://cdn.tailwindcss.com
                      https://unpkg.com
                      https://fonts.googleapis.com;
          style-src   'self' 'unsafe-inline'
                      https://fonts.googleapis.com
                      https://fonts.gstatic.com;
          font-src    'self' data:
                      https://fonts.gstatic.com;
          img-src     'self' data: https:;
          media-src   'self' data: https:;
          connect-src 'self' https:;
        " />

  <!-- Google Fonts: Inter + Playfair Display (Serif header font matching Finexpert 21Cent) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

  <!-- Notibot Bridge (Синхронно в head) -->
  <script src="./js/notibot-bridge.js"></script>

  <!-- Стили проекта -->
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body class="bg-[#151617] text-white min-h-screen antialiased">

  <!-- Экран загрузки (Loader) -->
  <div id="loading" class="loader-screen">
    <div class="loader-spinner"></div>
  </div>

  <!-- Корневой элемент приложения -->
  <div id="app"></div>

  <!-- Точка входа (Автономный бандл) -->
  <script src="./js/app-bundle.js"></script>

</body>
</html>
